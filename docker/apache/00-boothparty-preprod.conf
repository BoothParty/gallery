# Preprod déployée par Kamal (config/deploy.preprod.yml).
#
# À poser dans /etc/apache2/sites-enabled/ : le préfixe 00- la charge avant
# boothparty.conf, dont le ServerAlias *.boothparty.fr capterait ces noms.
# Requiert mod_headers (a2enmod headers).
#
# Apache termine le TLS et relaie à kamal-proxy, qui aiguille selon le Host :
# il doit donc arriver intact, d'autant qu'il entre dans la signature SigV4
# des URL S3. nocanon et NoDecode laissent aussi le chemin signé tel quel.
<VirtualHost *:443>
  ServerName preprod.boothparty.fr
  ServerAlias preprod-s3.boothparty.fr preprod-umami.boothparty.fr

  AllowEncodedSlashes NoDecode
  ProxyPreserveHost On
  ProxyPass "/" "http://127.0.0.1:8081/" nocanon
  ProxyPassReverse "/" "http://127.0.0.1:8081/"
  RequestHeader set X-Forwarded-Proto "https"

  # Copie de la prod, galeries d'invités comprises : rien ne doit être indexé.
  Header always set X-Robots-Tag "noindex, nofollow"

  SSLCertificateFile /etc/letsencrypt/live/boothparty.fr/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/boothparty.fr/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
