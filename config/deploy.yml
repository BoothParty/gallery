service: boothparty-gallery
image: boothparty/gallery

servers:
  web:
    hosts:
      - 10.117.19.66
    env:
      clear:
        # Un seul rôle joue les migrations (cf. docker/entrypoint.sh).
        RUN_MIGRATIONS: "true"
  job:
    hosts:
      - 10.117.19.66
    cmd: php artisan queue:work --tries=3 --max-time=3600
    options:
      # L'image FrankenPHP embarque un HEALTHCHECK sur le port admin de Caddy,
      # que le worker ne démarre pas : le conteneur serait "unhealthy" en boucle.
      no-healthcheck: true
  scheduler:
    hosts:
      - 10.117.19.66
    # Les relances du livre d'or partent d'une commande quotidienne : sans ce
    # rôle, rien ne déclenche le planificateur et les rappels ne sortent jamais.
    cmd: php artisan schedule:work
    options:
      # Même raison que le worker : pas de serveur HTTP dans ce conteneur.
      no-healthcheck: true

proxy:
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 90

# L'entrypoint attend MySQL, migre et génère les caches avant la 1re requête.
deploy_timeout: 120

registry:
  server: ghcr.io
  # Compte GitHub (pas l'organisation) dont le PAT a write:packages sur BoothParty.
  username: BoothParty
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch:
    - amd64

env:
  clear:
    APP_NAME: BoothParty
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://10.117.19.66

    LOG_CHANNEL: stderr
    LOG_LEVEL: warning

    # Les accessoires sont joignables sous <service>-<accessoire> sur le réseau "kamal".
    DB_CONNECTION: mysql
    DB_HOST: boothparty-gallery-db
    DB_PORT: "3306"
    DB_DATABASE: boothparty
    DB_USERNAME: boothparty

    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database

    FILESYSTEM_DISK: s3
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: boothparty
    AWS_USE_PATH_STYLE_ENDPOINT: "true"
    # Endpoint interne, pour les lectures et écritures de l'application.
    AWS_ENDPOINT: http://boothparty-gallery-s3:9000
    # Endpoint public : c'est lui qui signe les URL que charge le navigateur,
    # le host faisant partie de la signature SigV4.
    AWS_BROWSER_ENDPOINT: https://s3.boothparty.fr

    NOTION_DATABASE_ID: a436d78a826a4ed783bbcf64fff0a2c7
    NOTION_PROPERTY_NAME: Name
    NOTION_PROPERTY_DATE: Date
    NOTION_PROPERTY_STATUS: Status
    NOTION_PROPERTY_OPTIONS: Options

    PARTY_DOMAIN: boothparty.fr

    # Les mails du livre d'or partent d'ici ; les identifiants sont en secrets.
    MAIL_MAILER: smtp
    MAIL_SCHEME: smtps
    MAIL_PORT: "465"
    MAIL_FROM_ADDRESS: bonjour@boothparty.fr
    MAIL_FROM_NAME: BoothParty

    # Identifiant du site créé dans Umami, dont le domaine doit être
    # *.boothparty.fr : le hostname sert de dimension « party ».
    UMAMI_SCRIPT_URL: https://umami.boothparty.fr/script.js
    UMAMI_WEBSITE_ID: 00000000-0000-0000-0000-000000000000
    
    ZOHO_REDIRECT_URI: https://boothparty.fr/auth/zoho/callback
    OAUTH_ALLOWED_DOMAINS: boothparty.fr

  secret:
    - APP_KEY
    - DB_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - NOTION_API_TOKEN
    - MAIL_HOST
    - MAIL_USERNAME
    - MAIL_PASSWORD
    - PARTY_STUDIO_EMAIL
    - ZOHO_CLIENT_ID
    - ZOHO_CLIENT_SECRET

aliases:
  shell: app exec --interactive --reuse "bash"
  artisan: app exec --interactive --reuse "php artisan"

asset_path: /app/public/build

accessories:
  db:
    image: mysql:9.7.2
    host: 10.117.19.66
    port: "127.0.0.1:3306:3306"
    env:
      clear:
        MYSQL_DATABASE: boothparty
        MYSQL_USER: boothparty
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_PASSWORD
    directories:
      - data:/var/lib/mysql
  s3:
    image: rustfs/rustfs:latest
    host: 10.117.19.66
    # Le port 9000 n'est plus publié : le stockage n'est joignable que par le
    # proxy, et seulement par les URL signées qu'émet l'application. La console
    # d'administration reste sur la loopback, via un tunnel SSH.
    options:
      publish:
        - "127.0.0.1:9001:9001"
    proxy:
      host: s3.boothparty.fr
      app_port: 9000
      ssl: true
      # rustfs répond 400 sur le /up attendu par défaut.
      healthcheck:
        path: /health
    env:
      clear:
        RUSTFS_VOLUMES: /data
        RUSTFS_ADDRESS: '0.0.0.0:9000'
        RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
        RUSTFS_CONSOLE_ENABLE: 'true'
        RUSTFS_EXTERNAL_ADDRESS: ':9000'
        RUSTFS_CORS_ALLOWED_ORIGINS: '*'
        RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      secret:
        - RUSTFS_ACCESS_KEY
        - RUSTFS_SECRET_KEY
    # Volume nommé et non "directories:" : rustfs tourne en uid 10001, un dossier
    # hôte créé par Kamal appartient à root → "Permission denied" au démarrage.
    volumes:
      - boothparty_gallery_s3_data:/data
      
  umami-db:
    image: postgres:15.6
    host: 10.117.19.66
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: umami
        POSTGRES_USER: umami
        POSTGRES_PASSWORD: umami
    directories:
      - data:/var/lib/postgresql/data
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    host: 10.117.19.66
    env:
      clear:
        DATABASE_URL: postgresql://umami:umami@boothparty-gallery-umami-db:5432/umami
      secret:
        - APP_SECRET
    proxy:
      host: umami.boothparty.fr
      app_port: 3000
      ssl: true
      healthcheck:
        path: /api/heartbeat
