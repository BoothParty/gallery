# Monthly version updates, grouped to keep the PR count low. Security fixes
# come separately and immediately, through the repository's Dependabot
# security updates setting; the groups below only apply to version updates.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
